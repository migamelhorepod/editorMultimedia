name: Homologacao seguranca POC-003.1

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/Editor.Security/**'
      - 'src/Editor.Security.Worker/**'
      - 'tests/security/**'
      - 'tests/Editor.Timeline.Tests/**'
      - '.github/workflows/poc0031-security-gate.yml'

permissions:
  contents: read

jobs:
  security-release-gate:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Obter codigo
        uses: actions/checkout@v5
      - name: Verificar evidencias obrigatorias da POC
        shell: pwsh
        run: ./tests/security/assert-poc0031-release-gate.ps1
      - name: Publicar relatorio mesmo com pendencias
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: poc0031-security-release-gate
          if-no-files-found: warn
          retention-days: 14
          path: TestResults/poc0031-gate.json
