
name: Limpeza automatica de branches

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  limpar:
    runs-on: ubuntu-latest
    steps:
      - name: Verificar branches antigas
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;

            // Comeca em simulacao.
            // Troque para false somente apos conferir o relatorio.
            const SIMULACAO = false;

            const prs = await github.paginate(
              github.rest.pulls.list,
              {
                owner, repo,
                state: 'all',
                sort: 'updated',
                direction: 'desc',
                per_page: 100
              }
            );

            const branches = await github.paginate(
              github.rest.repos.listBranches,
              { owner, repo, per_page: 100 }
            );

            const existentes = new Set(
              branches.map(b => b.name)
            );

            const integrados = prs
              .filter(pr =>
                pr.merged_at &&
                pr.base.ref === 'main' &&
                pr.head.repo?.full_name ===
                  `${owner}/${repo}`
              )
              .sort((a, b) =>
                new Date(b.merged_at) -
                new Date(a.merged_at)
              );

            const protegidas = new Set(['main']);

            // Preserva as duas ultimas branches
            // integradas que ainda existem.
            let preservadas = 0;
            for (const pr of integrados) {
              if (
                existentes.has(pr.head.ref) &&
                !protegidas.has(pr.head.ref)
              ) {
                protegidas.add(pr.head.ref);
                preservadas++;
                if (preservadas === 2) break;
              }
            }

            // Preserva todas as branches com PR aberto.
            for (const pr of prs.filter(
              pr => pr.state === 'open'
            )) {
              if (
                pr.head.repo?.full_name ===
                `${owner}/${repo}`
              ) {
                protegidas.add(pr.head.ref);
              }
            }

            // So remove branches identificadas
            // em PRs que ja foram integrados.
            const candidatas = new Set(
              integrados.map(pr => pr.head.ref)
            );

            for (const branch of branches) {
              const nome = branch.name;

              if (
                protegidas.has(nome) ||
                branch.protected ||
                !candidatas.has(nome)
              ) {
                console.log(`PRESERVADA: ${nome}`);
                continue;
              }

              if (SIMULACAO) {
                console.log(
                  `SIMULACAO - excluiria: ${nome}`
                );
              } else {
                await github.rest.git.deleteRef({
                  owner,
                  repo,
                  ref: `heads/${nome}`
                });
                console.log(`EXCLUIDA: ${nome}`);
              }
            }
