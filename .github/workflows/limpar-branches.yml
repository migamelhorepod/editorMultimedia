
name: Limpeza automatica de branches

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  limpar:
    runs-on: ubuntu-latest
    steps:
      - name: Verificar branches antigas
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;

            // Comeca em simulacao.
            // Troque para false somente apos conferir o relatorio.
            const SIMULACAO = true;

            const prs = await github.paginate(
              github.rest.pulls.list,
              {
                owner, repo,
                state: 'all',
                sort: 'updated',
                direction: 'desc',
                per_page: 100
              }
            );

            const branches = await github.paginate(
              github.rest.repos.listBranches,
              { owner, repo, per_page: 100 }
            );

            const existentes = new Set(
              branches.map(b => b.name)
            );

            
const integrados = prs
  .filter(pr =>
    pr.merged_at &&
    pr.base.ref === 'main' &&
    pr.head.repo?.full_name === `${owner}/${repo}`
  )
  .sort((a, b) =>
    new Date(b.merged_at) - new Date(a.merged_at)
  );

// Preserve as duas ultimas integracoes reais,
// mesmo se a branch correspondente ja foi apagada.
const ultimasDuas = integrados.slice(0, 2);

const protegidas = new Set(['main']);

for (const pr of ultimasDuas) {
  protegidas.add(pr.head.ref);
}


            // Preserva todas as branches com PR aberto.
            for (const pr of prs.filter(
              pr => pr.state === 'open'
            )) {
              if (
                pr.head.repo?.full_name ===
                `${owner}/${repo}`
              ) {
                protegidas.add(pr.head.ref);
              }
            }

            // So remove branches identificadas
            // em PRs que ja foram integrados.
            const candidatas = new Set(
              integrados.map(pr => pr.head.ref)
            );

            for (const branch of branches) {
              const nome = branch.name;

              if (
                protegidas.has(nome) ||
                branch.protected ||
                !candidatas.has(nome)
              ) {
                console.log(`PRESERVADA: ${nome}`);
                continue;
              }

              if (SIMULACAO) {
                console.log(
                  `SIMULACAO - excluiria: ${nome}`
                );
              } else {
                await github.rest.git.deleteRef({
                  owner,
                  repo,
                  ref: `heads/${nome}`
                });
                console.log(`EXCLUIDA: ${nome}`);
              }
            }
