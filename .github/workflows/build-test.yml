name: Compilar e testar editor

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - name: Obter codigo
        uses: actions/checkout@v5

      - name: Preparar .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restaurar pacotes
        run: dotnet restore EditorMultimidia.sln

      - name: Compilar todos os projetos (inclui WPF)
        run: dotnet build EditorMultimidia.sln --configuration Release --no-restore

      - name: Executar testes
        run: dotnet test tests/Editor.Timeline.Tests/Editor.Timeline.Tests.csproj --configuration Release --no-build
